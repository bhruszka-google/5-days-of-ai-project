repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (linter)
        entry: .venv/bin/ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format (formatter)
        entry: .venv/bin/ruff format --check
        language: system
        types: [python]

      - id: pytest-unit
        name: pytest unit tests
        entry: .venv/bin/pytest -q
        language: system
        pass_filenames: false
        always_run: true
